name: Validate build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-smoke:
    name: ${{ matrix.platform }} source suite
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            runner: ubuntu-latest
            # Ubuntu can host a virtual X display, so the Tk UI suite really
            # runs there.  macOS runners cannot, and leave this empty.
            display: xvfb-run -a
          - platform: macOS
            runner: macos-latest
            display: ""
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install the Linux Tk display runtime
        if: matrix.platform == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb

      - name: Run cross-platform startup and quality regressions
        run: |
          python -m scientific_calculator --smoke-test
          python -m ruff check src tests

      - name: Run the full test suite
        # The whole suite runs here, not a three-file subset, so a platform
        # regression cannot reach a release through the Windows job alone.
        # The 100% coverage gate stays on Windows, where that baseline is
        # calibrated: tests/test_ui_runtime.py skips itself without a display,
        # which drops the achievable total to roughly 93% and would fail every
        # macOS run for a reason unrelated to code quality.
        run: ${{ matrix.display }} python -m pytest -q

  test-and-build:
    name: Windows quality and package validation
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Verify source package and quality gates
        shell: pwsh
        run: |
          $legacyModules = Get-ChildItem src -File -Filter '*.py'
          if ($legacyModules) { throw "Legacy source modules are not allowed outside src/scientific_calculator." }
          python scripts/requirements_sync_check.py
          python -m scientific_calculator --smoke-test
          python -m ruff check src tests
          python -m pyright
          python -m pip_audit -r requirements.txt
          python -m pytest -q --cov --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=xml --cov-report=json
          python scripts/verify_coverage.py coverage.json

      - name: Build and smoke-test Windows executable
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name ScientificCalculator --icon assets\icons\app.ico
          --hidden-import numpy.random._generator
          --collect-all numpy
          --collect-submodules scipy.stats --collect-submodules scipy.integrate
          --collect-submodules scipy.sparse
          --version-file packaging\windows\version_info.txt
          --add-data "assets\skins\skin_graphite.png;skins"
          --add-data "assets\skins\skin_blue.png;skins"
          --add-data "assets\skins\skin_pink.png;skins"
          --add-data "assets\skins\skin_white.png;skins"
          --add-data "assets\icons\app.ico;icons"
          --paths src src\scientific_calculator\__main__.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          # The app is a windowed build, so its streams have to be redirected to
          # be seen at all. Without this a failure reports only an exit code.
          $process = Start-Process -FilePath .\dist\ScientificCalculator\ScientificCalculator.exe `
            -ArgumentList '--smoke-test' -Wait -PassThru `
            -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt -ErrorAction SilentlyContinue
          Get-Content smoke-err.txt -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Packaged executable smoke test failed with exit code $($process.ExitCode)." }

      - name: Upload Windows validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-windows
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: warn
          retention-days: 7
