name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y or vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify tag and binary metadata agree
        run: |
          python scripts/version_sync_check.py "${{ inputs.tag || github.ref_name }}"
          python scripts/requirements_sync_check.py

  windows-release-build:
    name: Windows release build
    needs: verify-version
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned build and test dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Verify source package and version metadata
        shell: pwsh
        run: |
          $legacyModules = Get-ChildItem src -File -Filter '*.py'
          if ($legacyModules) { throw "Legacy source modules are not allowed outside src/scientific_calculator." }
          python scripts/version_sync_check.py "${{ inputs.tag || github.ref_name }}"
          python scripts/requirements_sync_check.py
          python -m scientific_calculator --smoke-test

      - name: Run quality and security gates
        shell: pwsh
        run: |
          python -m ruff check src tests
          python -m pyright
          python -m pip_audit -r requirements.txt
          python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Build standalone executable
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name ScientificCalculator --icon assets\icons\app.ico
          --hidden-import numpy.random._generator
          --collect-all numpy
          --collect-all scipy
          --version-file packaging\windows\version_info.txt
          --add-data "assets\skins\skin_graphite.png;skins"
          --add-data "assets\skins\skin_blue.png;skins"
          --add-data "assets\skins\skin_pink.png;skins"
          --add-data "assets\skins\skin_white.png;skins"
          --add-data "assets\icons\app.ico;icons"
          --paths src src\scientific_calculator\__main__.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\ScientificCalculator\ScientificCalculator.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged executable smoke test failed with exit code $($process.ExitCode)." }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp packaging\windows\installer.iss'

      - name: Verify installer uninstall lifecycle
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "ScientificCalculator-uninstall-$([guid]::NewGuid().ToString('N'))"
          $sentinel = Join-Path $installRoot 'DO_NOT_DELETE_USER_FILE.txt'
          $applicationData = Join-Path $env:LOCALAPPDATA 'ScientificCalculator'
          $fallbackApplicationData = Join-Path $env:USERPROFILE '.scientific_calculator\ScientificCalculator'
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'This file existed before Scientific Calculator was installed.' -NoNewline
          if (Test-Path -LiteralPath $applicationData) { Remove-Item -LiteralPath $applicationData -Recurse -Force }
          if (Test-Path -LiteralPath $fallbackApplicationData) { Remove-Item -LiteralPath $fallbackApplicationData -Recurse -Force }
          New-Item -ItemType Directory -Path $applicationData -Force | Out-Null
          New-Item -ItemType Directory -Path $fallbackApplicationData -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $applicationData 'preexisting-app-data-marker.txt') -Value 'application data must be removed' -NoNewline
          Set-Content -LiteralPath (Join-Path $fallbackApplicationData 'preexisting-fallback-app-data-marker.txt') -Value 'fallback application data must be removed' -NoNewline
          $installer = Resolve-Path .\dist\ScientificCalculator_Setup.exe
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          $installed = Join-Path $installRoot 'ScientificCalculator.exe'
          if (-not (Test-Path -LiteralPath $installed)) { throw 'Installed executable was not found.' }
          $process = Start-Process -FilePath $installed -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed executable smoke test failed with exit code $($process.ExitCode)." }
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'Uninstaller was not found.' }
          $process = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path -LiteralPath $sentinel)) { throw 'Uninstall deleted a user file from the selected installation folder.' }
          if (Test-Path -LiteralPath $installed) { throw 'Uninstall left the application executable behind.' }
          if (Test-Path -LiteralPath $applicationData) { throw 'Uninstall left Scientific Calculator application data behind.' }
          if (Test-Path -LiteralPath $fallbackApplicationData) { throw 'Uninstall left fallback Scientific Calculator application data behind.' }

      - name: Package portable Windows build
        shell: pwsh
        run: Compress-Archive -Path .\dist\ScientificCalculator\* -DestinationPath .\dist\ScientificCalculator-windows.zip -Force

      - name: Upload final Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows
          path: |
            dist/ScientificCalculator_Setup.exe
            dist/ScientificCalculator-windows.zip
          if-no-files-found: error
          retention-days: 7

  linux-release-build:
    name: Linux release build
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned build and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test source package
        run: |
          test -z "$(find src -maxdepth 1 -type f -name '*.py' -print -quit)"
          python scripts/requirements_sync_check.py
          python -m scientific_calculator --smoke-test
          SCICALC_REQUIRE_LIVE_UI=1 xvfb-run -a python -m pytest -q

      - name: Build Linux executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name ScientificCalculator
          --hidden-import numpy.random._generator
          --collect-all numpy
          --collect-all scipy
          --add-data "assets/skins/skin_graphite.png:skins"
          --add-data "assets/skins/skin_blue.png:skins"
          --add-data "assets/skins/skin_pink.png:skins"
          --add-data "assets/skins/skin_white.png:skins"
          --add-data "assets/icons/app.ico:icons"
          --paths src src/scientific_calculator/__main__.py

      - name: Smoke-test and package Linux executable
        run: |
          ./dist/ScientificCalculator/ScientificCalculator --smoke-test
          tar -C dist -czf dist/ScientificCalculator-linux.tar.gz ScientificCalculator

      - name: Upload final Linux asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-linux
          path: dist/ScientificCalculator-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos-release-build:
    name: macOS ${{ matrix.architecture }} release build
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: intel
          - runner: macos-14
            architecture: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned build and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test source package
        run: |
          test -z "$(find src -maxdepth 1 -type f -name '*.py' -print -quit)"
          python scripts/requirements_sync_check.py
          python -m scientific_calculator --smoke-test
          python -m pytest -q

      - name: Create native macOS application icon
        run: |
          rm -rf build/ScientificCalculator.iconset build/app.icns
          mkdir -p build/ScientificCalculator.iconset
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open("assets/icons/app.ico").convert("RGBA")
          iconset = Path("build/ScientificCalculator.iconset")
          for points in (16, 32, 128, 256, 512):
              for suffix, pixels in (("", points), ("@2x", points * 2)):
                  source.resize((pixels, pixels), Image.Resampling.LANCZOS).save(
                      iconset / f"icon_{points}x{points}{suffix}.png"
                  )
          PY
          iconutil -c icns build/ScientificCalculator.iconset -o build/app.icns

      - name: Build macOS application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name ScientificCalculator --icon build/app.icns
          --hidden-import numpy.random._generator
          --collect-all numpy
          --collect-all scipy
          --add-data "assets/skins/skin_graphite.png:skins"
          --add-data "assets/skins/skin_blue.png:skins"
          --add-data "assets/skins/skin_pink.png:skins"
          --add-data "assets/skins/skin_white.png:skins"
          --add-data "assets/icons/app.ico:icons"
          --paths src src/scientific_calculator/__main__.py

      - name: Smoke-test and package macOS application
        run: >-
          ./dist/ScientificCalculator.app/Contents/MacOS/ScientificCalculator --smoke-test
          && ditto -c -k --sequesterRsrc --keepParent
          dist/ScientificCalculator.app
          dist/ScientificCalculator-macos-${{ matrix.architecture }}.zip

      - name: Upload final macOS asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos-${{ matrix.architecture }}
          path: dist/ScientificCalculator-macos-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [windows-release-build, linux-release-build, macos-release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source for release verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download final release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate and verify final SHA-256 checksums
        run: |
          cd release-assets
          sha256sum \
            ScientificCalculator_Setup.exe \
            ScientificCalculator-windows.zip \
            ScientificCalculator-linux.tar.gz \
            ScientificCalculator-macos-intel.zip \
            ScientificCalculator-macos-apple-silicon.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attest final release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          Scientific Calculator release ${RELEASE_TAG}.

          Source commit: ${GITHUB_SHA}

          Validation: Windows, Linux, macOS Intel, and macOS Apple Silicon builds passed their automated tests and packaged smoke tests. The Windows installer uninstall regression verifies that it preserves pre-existing files in a custom install folder while removing all Scientific Calculator application data.

          Integrity: SHA256SUMS.txt was generated from the final uploaded assets and artifact provenance attestations are attached.

          Signing: Windows and macOS binaries are unsigned. Linux and macOS packages are CI-built and smoke-tested but have not been manually device-tested.
          EOF
          gh release create "$RELEASE_TAG" \
            release-assets/ScientificCalculator_Setup.exe \
            release-assets/ScientificCalculator-windows.zip \
            release-assets/ScientificCalculator-linux.tar.gz \
            release-assets/ScientificCalculator-macos-intel.zip \
            release-assets/ScientificCalculator-macos-apple-silicon.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "Scientific Calculator ${RELEASE_TAG}" \
            --notes-file release-notes.md
